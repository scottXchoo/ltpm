# deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ltpm-deployment
  labels:
    app: ltpm
spec:
  replicas: 1 # LTPM 컨트롤러는 하나만 실행
  selector:
    matchLabels:
      app: ltpm
  template:
    metadata:
      labels:
        app: ltpm
    spec:
      # Pod가 사용할 ServiceAccount(신분증)를 2단계에서 만든 것으로 지정 (매우 중요!)
      serviceAccountName: ltpm-sa
      containers:
        - name: ltpm-controller
          image: kyohyunchoo/ltpm:1.2
          imagePullPolicy: Always

          # --- 이 부분을 추가합니다 ---
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "--- Container command started. Attempting to run Python script... ---"
              python -u main.py
              echo "--- Python script finished without crashing. ---"
